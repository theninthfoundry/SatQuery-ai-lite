name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit, API and geospatial tests
        run: python -m pytest tests -q

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements-dev.txt
      - run: python tests/e2e/make_fixtures.py
      - run: npm install --no-audit --no-fund
        working-directory: tests/e2e
      - name: Start the API with static files and run the browser-environment test
        env:
          SATQUERY_SERVE_STATIC: "1"
        run: |
          python -m uvicorn api.analyze:app --port 8765 &
          for i in $(seq 1 30); do curl -sf localhost:8765/api/health && break; sleep 1; done
          npm test
        working-directory: tests/e2e
