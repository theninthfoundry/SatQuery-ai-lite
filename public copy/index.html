<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatQuery AI Lite — Evidence-First Remote Sensing Intelligence</title>
<meta name="description" content="Evidence-first change intelligence for satellite imagery: image quality, alignment diagnostics, spatial evidence and threshold sensitivity, with every result traceable to measurements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090B; --bg-alt: #111113; --panel: #18181B; --panel-2: #27272A; --panel-3: #323238;
  --border: #3F3F46; --border-soft: rgba(63,63,70,.55);
  --text: #FAFAFA; --text-muted: #A1A1AA; --text-faint: #71717A;
  --optical: #E8A33D; --sar: #5EC8D8; --ok: #4FD1A5; --change: #EF4444; --warn: #F59E0B; --orange: #FB923C;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sar); outline-offset: 2px; }
.hidden { display: none !important; }
.mono { font-family: var(--mono); }
.muted { color: var(--text-muted); } .faint { color: var(--text-faint); }

header { border-bottom: 1px solid var(--border-soft); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 34px; height: 34px; border: 1px solid var(--sar); border-radius: 8px; display: grid; place-items: center; font: 600 13px var(--mono); color: var(--sar); }
.brand h1 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.brand p { font-size: 12px; color: var(--text-muted); }
.hdr-right { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--text-muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 100px; font: 500 11.5px var(--mono); white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
.pill.ok .dot { background: var(--ok); } .pill.bad .dot { background: var(--change); }
.navtabs { display: flex; gap: 2px; }
.navtabs button { background: none; border: 0; padding: 6px 12px; border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer; }
.navtabs button.active { background: var(--panel-2); color: var(--text); }

main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; padding: 20px 24px 60px; max-width: 1500px; margin: 0 auto; align-items: start; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }

.card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--r-md); padding: 16px; }
.card + .card { margin-top: 14px; }
.card h2 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 12px; }
.card h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.side { position: sticky; top: 14px; }
@media (max-width: 960px) { .side { position: static; } }

.seg { display: grid; gap: 6px; margin-bottom: 14px; }
.seg button { text-align: left; padding: 9px 12px; background: var(--bg-alt); border: 1px solid var(--border-soft); border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer; }
.seg button.active { border-color: var(--sar); color: var(--text); }
.seg small { display: block; color: var(--text-faint); font-size: 11.5px; }

.slot { margin-bottom: 12px; }
.slot-label { font-size: 12.5px; font-weight: 500; }
.slot-hint { font-size: 11.5px; color: var(--text-faint); margin-bottom: 4px; }
.drop { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px dashed var(--border); border-radius: var(--r-sm); background: var(--bg-alt); cursor: pointer; min-height: 56px; }
.drop:hover, .drop.over { border-color: var(--sar); }
.drop.filled { border-style: solid; }
.drop input { display: none; }
.drop img, .drop .ph { width: 42px; height: 42px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); flex: none; }
.drop .ph { display: grid; place-items: center; font: 10px var(--mono); color: var(--text-faint); }
.drop .meta { min-width: 0; font-size: 12px; }
.drop .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.slot-err { color: var(--change); font-size: 12px; margin-top: 4px; }

textarea, select, input[type=number], input[type=text] { width: 100%; background: var(--bg-alt); border: 1px solid var(--border-soft); border-radius: var(--r-sm); padding: 9px 11px; }
textarea { resize: vertical; min-height: 72px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: none; border: 1px solid var(--border-soft); color: var(--text-muted); font-size: 11.5px; padding: 4px 9px; border-radius: 100px; cursor: pointer; text-align: left; }
.chip:hover { color: var(--text); border-color: var(--sar); }
details.opts { margin-top: 12px; border-top: 1px solid var(--border-soft); padding-top: 10px; }
details.opts summary { cursor: pointer; color: var(--text-muted); font-size: 12.5px; }
.optgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.optgrid label { font-size: 11.5px; color: var(--text-muted); display: block; margin-bottom: 3px; }
.optgrid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--text-muted); margin-top: 10px; }
.check input { margin-top: 3px; }
.btnrow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-top: 14px; }
.btn { padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--panel-2); cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--panel-3); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover:not(:disabled) { background: #e4e4e7; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 12px; }

.banner { border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 14px; background: var(--panel); }
.banner.err { border-color: rgba(239,68,68,.6); background: rgba(239,68,68,.07); }
.banner.warn { border-color: rgba(245,158,11,.55); background: rgba(245,158,11,.06); }
.banner.info { border-color: rgba(94,200,216,.45); background: rgba(94,200,216,.06); }
.banner h3 { font-size: 13.5px; margin-bottom: 4px; }

.empty { border: 1px dashed var(--border); border-radius: var(--r-lg); padding: 48px 24px; text-align: center; color: var(--text-muted); }
.empty h2 { font-size: 17px; color: var(--text); margin-bottom: 8px; }
.empty ul { text-align: left; display: inline-block; margin-top: 14px; font-size: 13px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-soft); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.tabs button.active { color: var(--text); border-color: var(--sar); }

.answer { font-size: 16.5px; line-height: 1.55; letter-spacing: -.005em; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 100px; font: 500 11.5px var(--mono); border: 1px solid var(--border); }
.b-OK, .b-SUPPORTED, .b-GOOD, .b-COMPLETED, .b-PROCEED, .b-COMPATIBLE, .b-STRONG { color: var(--ok); border-color: rgba(79,209,165,.5); }
.b-CAUTION, .b-WARNING, .b-ACCEPTABLE, .b-COMPLETED_WITH_WARNINGS, .b-PROCEED_WITH_WARNINGS, .b-MODERATE, .b-CONCERN, .b-COMPATIBLE_WITH_WARNINGS { color: var(--warn); border-color: rgba(245,158,11,.5); }
.b-WEAK { color: var(--orange); border-color: rgba(251,146,60,.5); }
.b-UNSUPPORTED, .b-UNRELIABLE, .b-POOR, .b-UNUSABLE, .b-SEVERE, .b-REJECT, .b-REQUEST_BETTER_IMAGERY, .b-HIGH, .b-INCOMPATIBLE, .b-ERROR { color: var(--change); border-color: rgba(239,68,68,.55); }
.b-NONE, .b-INFO, .b-NOT_ASSESSED, .b-NO_CHANGE { color: var(--text-muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { background: var(--bg-alt); border: 1px solid var(--border-soft); border-radius: var(--r-sm); padding: 10px 12px; }
.tile .k { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font: 500 18px var(--mono); margin-top: 2px; }
.tile .s { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

.statements { list-style: none; display: grid; gap: 8px; }
.statements li { padding: 10px 12px; background: var(--bg-alt); border: 1px solid var(--border-soft); border-left: 3px solid var(--sar); border-radius: var(--r-sm); font-size: 13.5px; }
.statements li .basis { display: block; margin-top: 4px; font: 11px var(--mono); color: var(--text-faint); word-break: break-all; }
.list { display: grid; gap: 6px; list-style: none; }
.list li { font-size: 13px; padding-left: 14px; position: relative; color: var(--text-muted); }
.list li::before { content: ''; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint); }

.cols2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .cols2 { grid-template-columns: 1fr; } }

.viewer { position: relative; overflow: hidden; border-radius: var(--r-sm); border: 1px solid var(--border); background: #000; }
.viewer-inner { position: relative; width: 100%; transform-origin: 0 0; transition: transform .45s cubic-bezier(.4,0,.2,1); }
@media (prefers-reduced-motion: reduce) { .viewer-inner { transition: none; } }
.viewer img { display: block; width: 100%; height: 100%; }
.viewer.zoomed img { image-rendering: pixelated; }
.viewer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cell { fill: transparent; stroke: rgba(255,255,255,.28); stroke-width: .6; cursor: pointer; vector-effect: non-scaling-stroke; }
.cell:hover { fill: rgba(255,255,255,.12); }
.cell.active { stroke: var(--sar); stroke-width: 2.5; fill: rgba(94,200,216,.14); }
.layer-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.layer-btns button { background: var(--bg-alt); border: 1px solid var(--border-soft); color: var(--text-muted); padding: 4px 10px; border-radius: 100px; font-size: 12px; cursor: pointer; }
.layer-btns button.active { color: var(--text); border-color: var(--sar); }
.caption { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

.compare { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--r-sm); user-select: none; touch-action: none; }
.compare img { display: block; width: 100%; }
.compare .top { position: absolute; inset: 0; }
.compare .bar { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; cursor: ew-resize; }
.compare .bar::after { content: '⇆'; position: absolute; top: 50%; left: -13px; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; transform: translateY(-50%); font-size: 14px; }
.compare .tag { position: absolute; top: 8px; left: 8px; font: 11px var(--mono); background: rgba(0,0,0,.65); padding: 2px 7px; border-radius: 4px; }
.compare .tag.r { left: auto; right: 8px; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 500; color: var(--text-faint); padding: 6px 8px; border-bottom: 1px solid var(--border-soft); font-size: 11.5px; }
td { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--mono); }
tr.row-click { cursor: pointer; } tr.row-click:hover td { background: rgba(255,255,255,.04); } tr.sel td { background: rgba(94,200,216,.1); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--text-faint); } .kv dd { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 70px; gap: 10px; align-items: center; font: 12px var(--mono); margin: 6px 0; }
.bar-track { height: 8px; background: var(--panel-2); border-radius: 100px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--sar); border-radius: 100px; }
.bar-fill.base { background: var(--optical); }
.callout { border-left: 3px solid var(--warn); padding: 8px 12px; background: rgba(245,158,11,.06); font-size: 12.5px; color: var(--text-muted); border-radius: 0 var(--r-sm) var(--r-sm) 0; margin-top: 10px; }

.trace { margin-top: 18px; }
.trace summary { cursor: pointer; font: 11.5px var(--mono); color: var(--text-muted); padding: 6px 0; }
.trace-lines { font: 12px var(--mono); display: grid; gap: 4px; padding: 10px 14px; background: var(--bg-alt); border: 1px solid var(--border-soft); border-radius: var(--r-sm); max-height: 260px; overflow: auto; }
.trace-lines div { display: grid; grid-template-columns: 62px 150px 1fr 60px; gap: 10px; }
.trace-lines .t { color: var(--text-faint); } .trace-lines .l { color: var(--ok); } .trace-lines .ms { color: var(--text-faint); text-align: right; }
.report-sec { margin-bottom: 18px; }
.report-sec h3 { font-size: 14px; }
.report-sec p { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; }
.dl { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25); border-top-color: var(--bg); animation: spin .8s linear infinite; display: inline-block; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
pre.json { font: 11.5px var(--mono); background: var(--bg-alt); border: 1px solid var(--border-soft); border-radius: var(--r-sm); padding: 10px; overflow: auto; max-height: 340px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">SQ</div>
    <div><h1>SatQuery AI Lite</h1><p>Evidence-first remote sensing intelligence</p></div>
  </div>
  <nav class="navtabs" aria-label="Views">
    <button data-view="analysis" class="active">Analysis</button>
    <button data-view="stac">STAC inspector</button>
  </nav>
  <div class="hdr-right"><span id="apiPill" class="pill"><span class="dot"></span><span id="apiText">connecting…</span></span></div>
</header>

<main>
  <aside class="side" id="side">
    <div class="card">
      <h2>Input</h2>
      <div class="seg" id="modeSeg">
        <button data-mode="single" class="active">Single image<small>caption, question, grounding</small></button>
        <button data-mode="bitemporal">Bi-temporal pair<small>change intelligence</small></button>
        <button data-mode="cross">Optical + SAR pair<small>joint proxy analysis</small></button>
      </div>
      <div id="slots"></div>
      <label class="check"><input type="checkbox" id="downscale"><span>If an image is over the size limit, downscale it in the browser (recorded in provenance).</span></label>
    </div>
    <div class="card">
      <h2>Question</h2>
      <textarea id="query" maxlength="500" placeholder="Ask about the imagery…"></textarea>
      <div class="chips" id="chips"></div>
      <details class="opts" id="optsBox">
        <summary>Change-analysis parameters</summary>
        <div class="optgrid">
          <div><label for="optGrid">Grid size</label><select id="optGrid"></select></div>
          <div><label for="optBase">Base threshold</label><input type="number" id="optBase" min="1" max="254" value="28"></div>
          <div class="full"><label for="optThr">Sensitivity thresholds (comma-separated)</label><input type="text" id="optThr" value="20, 28, 40"></div>
        </div>
      </details>
      <div class="btnrow">
        <button class="btn primary" id="runBtn" disabled>Run analysis</button>
        <button class="btn" id="checkBtn" disabled title="Image quality, alignment and metadata only">Check inputs</button>
        <button class="btn" id="resetBtn">Reset</button>
      </div>
    </div>
  </aside>

  <section id="work" aria-live="polite"></section>
</main>

<script>
"use strict";
/* The interface renders what the API returns. It computes no findings, areas, confidences or interpretations. */

const $ = (s, r = document) => r.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
function h(tag, cls, ...kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const fmt = (n, d = 1) => (n == null || Number.isNaN(n)) ? '—' : Number(n).toFixed(d);
const pct = (n, d = 1) => n == null ? '—' : fmt(n, d) + '%';
const mb = b => (b / 1e6).toFixed(2) + ' MB';
const humanize = s => String(s).replace(/_/g, ' ').toLowerCase();
function badge(value, label) { return h('span', 'badge b-' + value, label || humanize(value)); }
const LEVEL_CLASS = {
  brightness: { NORMAL: 'OK', DARK: 'WARNING', BRIGHT: 'WARNING' },
  contrast: { GOOD: 'OK', MODERATE: 'OK', LOW: 'WARNING' },
  clipping: { LOW: 'OK', ELEVATED: 'INFO', HIGH: 'WARNING', SEVERE: 'SEVERE' },
  sharpness: { NORMAL: 'OK', LOW: 'WARNING', VERY_LOW: 'WARNING' },
  noise: { LOW: 'OK', ELEVATED: 'WARNING', HIGH: 'SEVERE' },
  resolution: { ADEQUATE: 'OK', LOW: 'WARNING', VERY_LOW: 'SEVERE' },
};

const QUICK = {
  single: ['Describe the land-cover and major objects visible in this image.', 'How much vegetation cover is present?', 'Highlight the water body referred to in the query.', 'Highlight the built-up area in this image.'],
  bitemporal: ['What changed between these two dates, and where did the change occur?', 'Has the built-up area increased, decreased, or remained unchanged?', 'Has the water coverage increased, decreased, or remained unchanged?'],
  cross: ['Use the optical and SAR images together to identify built-up and water-covered regions.', 'How much of the scene is water according to both sensors?'],
};
const SLOTS = {
  single: [{ id: 'image', label: 'Image', hint: 'PNG, JPEG or 8-bit GeoTIFF' }],
  bitemporal: [{ id: 'time_a', label: 'Time A — earlier', hint: 'Same area as Time B' }, { id: 'time_b', label: 'Time B — later', hint: 'Same area as Time A' }],
  cross: [{ id: 'optical', label: 'Optical image', hint: 'RGB composite' }, { id: 'sar', label: 'SAR image', hint: 'Single-channel amplitude / backscatter rendering' }],
};

const S = {
  mode: 'single', files: {}, caps: null, busy: false, view: 'analysis',
  result: null, tab: 'overview', layer: null, cell: null, zoom: false, evLayer: 'evidence_grid',
};

/* ───────────── bootstrap ───────────── */
async function boot() {
  const pill = $('#apiPill'), txt = $('#apiText');
  try {
    const [hr, cr] = await Promise.all([fetch('/api/health'), fetch('/api/capabilities')]);
    if (!hr.ok || !cr.ok) throw new Error('bad status');
    const health = await hr.json();
    S.caps = await cr.json();
    pill.classList.add('ok'); txt.textContent = `API online · engine ${health.engine_version}`;
    const sel = $('#optGrid');
    for (let n = S.caps.limits.min_grid_size; n <= S.caps.limits.max_grid_size; n++) sel.append(new Option(`${n} × ${n}`, n, false, n === S.caps.parameters.change_parameters.grid_size));
  } catch (e) {
    pill.classList.add('bad'); txt.textContent = 'API unreachable';
  }
  setMode('single');
}

/* ───────────── inputs ───────────── */
function setMode(m) {
  S.mode = m; S.files = {};
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  $('#optsBox').classList.toggle('hidden', m !== 'bitemporal');
  renderSlots(); renderChips(); S.result = null; renderWork(); syncButtons();
}
function renderChips() {
  const box = $('#chips'); box.replaceChildren();
  for (const q of QUICK[S.mode]) { const c = h('button', 'chip', q); c.type = 'button'; c.onclick = () => { $('#query').value = q; }; box.append(c); }
}
function renderSlots() {
  const box = $('#slots'); box.replaceChildren();
  for (const cfg of SLOTS[S.mode]) {
    const drop = h('label', 'drop');
    const input = h('input'); input.type = 'file'; input.accept = 'image/png,image/jpeg,image/tiff,.tif,.tiff';
    const info = h('div', 'meta', h('b', null, 'Click or drop a file'), h('span', 'faint', 'PNG · JPEG · GeoTIFF'));
    drop.append(input, h('div', 'ph', '＋'), info);
    const err = h('div', 'slot-err hidden');
    input.onchange = () => input.files[0] && loadFile(input.files[0], cfg, drop, err);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0], cfg, drop, err); };
    box.append(h('div', 'slot', h('div', 'slot-label', cfg.label), h('div', 'slot-hint', cfg.hint), drop, err));
  }
}
function readAsDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
function loadImageEl(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }

async function downscale(file, limit) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImageEl(url);
    let scale = Math.min(1, 2400 / Math.max(img.width, img.height));

    ['CRS', g.crs.epsg ? `EPSG:${g.crs.epsg} (${g.crs.kind}, ${g.crs.units})` : g.crs.user_defined ? 'user-defined' : 'not specified'],
    ['pixel size', g.pixel_size ? `${g.pixel_size.x} × ${g.pixel_size.y} ${g.pixel_size.units}` : '—'],
    ['bounds (native)', g.bounds_native ? `W ${g.bounds_native.west} S ${g.bounds_native.south} E ${g.bounds_native.east} N ${g.bounds_native.north}` : '—'],
    ['bounds (WGS84)', g.bounds_wgs84 ? `W ${fmt(g.bounds_wgs84.west, 5)} S ${fmt(g.bounds_wgs84.south, 5)} E ${fmt(g.bounds_wgs84.east, 5)} N ${fmt(g.bounds_wgs84.north, 5)}` : 'not derived'],
    ['NoData', g.nodata == null ? '—' : g.nodata], ['layout', `${g.tiled ? 'tiled' : 'striped'}, ${g.overview_count} overview(s)${g.cog_like_layout ? ' · COG-like (unvalidated)' : ''}`],
    ['pixel analysis', g.pixel_analysis_supported ? 'supported' : 'not supported']];
  const dl = h('dl', 'kv'); for (const [k, v] of rows) dl.append(h('dt', null, k), h('dd', null, v));
  const box = h('div', null, dl);
  if (!g.pixel_analysis_supported) box.append(h('div', 'callout', g.pixel_analysis_unsupported_reason));
  if (g.notes && g.notes.length) box.append(h('ul', 'list', g.notes.map(n => h('li', null, n))));
  box.append(h('div', 'caption', g.scope_note)); return box;
}

/* ───────────── Sensitivity ───────────── */
function renderSensitivity(r) {
  const s = r.evidence.sensitivity, st = r.evidence.stability, nf = r.evidence.noise_floor, rad = r.evidence.radiometric;
  const root = h('div', 'cols2'), left = h('div'), right = h('div');
  const bars = h('div', 'card', h('h2', null, 'Changed area across thresholds'));
  const max = Math.max(...s.thresholds.map(t => t.changed_pct), 1);
  for (const t of s.thresholds) bars.append(h('div', 'bar-row', h('span', null, `> ${t.threshold}${t.is_base ? ' ●' : ''}`), h('div', 'bar-track', Object.assign(h('div', 'bar-fill' + (t.is_base ? ' base' : '')), { style: `width:${t.changed_pct / max * 100}%` })), h('span', null, pct(t.changed_pct))));
  bars.append(h('div', 'chiprow', badge(s.sensitivity_level), h('span', 'badge mono', 'index ' + fmt(s.sensitivity_index, 2))), h('div', 'caption', `${s.definition}. ${s.level_rule}. ● = base threshold.`));
  const tbl = h('table', null, h('thead', null, h('tr', null, h('th', 'num', 'threshold'), h('th', 'num', 'changed px'), h('th', 'num', 'changed %'), h('th', 'num', 'Δ vs base (pp)'), h('th', 'num', 'IoU vs base')))), tb = h('tbody');
  for (const t of s.thresholds) tb.append(h('tr', null, h('td', 'num', t.threshold), h('td', 'num', t.changed_pixels.toLocaleString()), h('td', 'num', fmt(t.changed_pct, 2)), h('td', 'num', (t.delta_vs_base_pp >= 0 ? '+' : '') + fmt(t.delta_vs_base_pp, 2)), h('td', 'num', fmt(t.iou_with_base, 3))));
  tbl.append(tb); left.append(bars, h('div', 'card', tbl));
  const unc = (r.layers || []).find(l => l.id === 'uncertain');
  if (unc) left.append(h('div', 'card', h('h2', null, unc.label), makeViewer(unc, {}), h('div', 'caption', unc.description)));
  right.append(h('div', 'card', h('h2', null, 'Stable vs ambiguous change'),
    h('dl', 'kv', h('dt', null, 'stable'), h('dd', null, `${st.stable_pixels.toLocaleString()} px (${pct(st.stable_pct, 2)})`), h('dt', null, 'ambiguous'), h('dd', null, `${st.ambiguous_pixels.toLocaleString()} px (${pct(st.ambiguous_pct, 2)})`),
      h('dt', null, 'base retained'), h('dd', null, st.retention_of_base == null ? '—' : pct(st.retention_of_base * 100, 1)), h('dt', null, 'ambiguous share'), h('dd', null, st.ambiguous_share_of_all_changed == null ? '—' : pct(st.ambiguous_share_of_all_changed * 100, 1))),
    h('div', 'callout', st.note)));
  right.append(h('div', 'card', h('h2', null, 'Noise floor'), h('dl', 'kv', h('dt', null, 'σ A / B'), h('dd', null, `${fmt(nf.sigma_a)} / ${fmt(nf.sigma_b)}`), h('dt', null, 'σ of |A−B|'), h('dd', null, fmt(nf.sigma_difference)), h('dt', null, 'threshold ÷ σ'), h('dd', null, nf.threshold_over_sigma == null ? '—' : fmt(nf.threshold_over_sigma, 1) + ` (need ≥ ${nf.required_multiple})`)),
    nf.threshold_within_noise ? h('div', 'callout', 'The base threshold is within the estimated noise: some detected change may be noise.') : null, h('div', 'caption', nf.note)));
  right.append(h('div', 'card', h('h2', null, 'Radiometric offset'), h('dl', 'kv', h('dt', null, 'median B−A'), h('dd', null, fmt(rad.median_signed_difference, 2) + ' gray levels'), h('dt', null, 'changed after removing offset'), h('dd', null, pct(rad.offset_corrected_changed_pct, 2))), h('div', 'caption', rad.note)));
  root.append(left, right); return root;
}

/* ───────────── Layers (switcher + before/after compare) ───────────── */
function renderLayers(r) {
  const layers = r.layers || [], root = h('div', 'card', h('h2', null, 'Visual layers (switch without re-running the analysis)'));
  const before = layers.find(l => l.id === 'before'), after = layers.find(l => l.id === 'after');
  const entries = layers.map(l => [l.id, l]);
  if (before && after) entries.push(['compare', { id: 'compare', label: 'Before / after slider', description: 'Drag the handle to compare Time A (left) with Time B (right) on the same grid.' }]);
  const cur = entries.some(([id]) => id === S.layer) ? S.layer : entries[0][0]; S.layer = cur;
  const lb = h('div', 'layer-btns');
  for (const [id, l] of entries) { const b = h('button', id === cur ? 'active' : '', l.label); b.onclick = () => { S.layer = id; renderWork(); }; lb.append(b); }
  root.append(lb);
  const l = entries.find(([id]) => id === cur)[1];
  root.append(cur === 'compare' ? compareSlider(before, after) : makeViewer(l, {}), h('div', 'caption', l.description));
  return root;
}
function compareSlider(a, b) {
  const wrap = h('div', 'compare'); wrap.style.aspectRatio = `${a.width} / ${a.height}`;
  const base = Object.assign(h('img'), { src: b.data, alt: 'Time B' });
  const top = h('div', 'top'), ta = Object.assign(h('img'), { src: a.data, alt: 'Time A' }); ta.style.cssText = 'position:absolute;inset:0;width:100%;height:100%'; top.append(ta);
  const bar = h('div', 'bar'); wrap.append(base, top, bar, h('span', 'tag', 'A'), h('span', 'tag r', 'B'));
  const set = x => { const p = Math.max(0, Math.min(1, x)); top.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; bar.style.left = `calc(${p * 100}% - 1px)`; };
  set(0.5);
  const move = e => { const bb = wrap.getBoundingClientRect(); set((e.clientX - bb.left) / bb.width); };
  wrap.addEventListener('pointerdown', e => { wrap.setPointerCapture(e.pointerId); move(e); wrap.onpointermove = move; });
  wrap.addEventListener('pointerup', () => { wrap.onpointermove = null; });
  return wrap;
}

/* ───────────── Methodology ───────────── */
function renderMethod(r) {
  const m = r.methodology, root = h('div', 'cols2'), l = h('div'), rt = h('div');
  l.append(h('div', 'card', h('h2', null, 'Method'), h('h3', null, m.name), h('ol', 'list', m.steps.map(s => h('li', null, s))), h('div', 'caption', 'gray = ' + m.gray_definition)));
  l.append(h('div', 'card', h('h2', null, 'Parameters used'), h('pre', 'json', JSON.stringify(m.parameters, null, 2))));
  rt.append(h('div', 'card', h('h2', null, 'Limitations'), h('ul', 'list', r.limitations.map(x => h('li', null, x)))));
  rt.append(h('div', 'card', h('h2', null, 'Reliability factors'), h('div', 'caption', r.reliability.rule), h('table', null, h('tbody', null, r.reliability.factors.map(f => h('tr', null, h('td', null, h('span', 'mono', f.name)), h('td', null, badge(f.status)), h('td', 'muted', f.detail)))))));
  rt.append(h('div', 'card', h('h2', null, 'Provenance'), h('dl', 'kv', h('dt', null, 'analysis id'), h('dd', null, r.provenance.analysis_id), h('dt', null, 'engine / schema'), h('dd', null, `${r.engine_version} / ${r.schema_version}`),
    ...r.provenance.inputs.flatMap(i => [h('dt', null, i.role), h('dd', null, `${i.format} ${i.original_size.join('×')} → ${i.working_size.join('×')} · ${mb(i.bytes)} · sha256 ${i.sha256.slice(0, 20)}…`)])),
    h('ul', 'list', r.provenance.processing_steps.map(s => h('li', null, s))), h('div', 'caption', r.provenance.replay_note)));
  root.append(l, rt); return root;
}

/* ───────────── Report / export ───────────── */
function download(name, mime, text) { const url = URL.createObjectURL(new Blob([text], { type: mime })); const a = h('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function printableReport(r) {
  const secs = r.report.sections.map(s => `<section><h2>${esc(s.title)}</h2>${s.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}${s.bullets.length ? `<ul>${s.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}</section>`).join('');
  const pick = ['before', 'after', 'change_mask', 'evidence_grid', 'uncertain', 'combined', 'original', 'overlay', 'optical', 'sar', 'fused'];
  const imgs = (r.layers || []).filter(l => pick.includes(l.id)).map(l => `<figure><img src="${l.data}" alt="${esc(l.label)}"><figcaption>${esc(l.label)} — ${esc(l.description)}</figcaption></figure>`).join('');
  return `<!doctype html><meta charset="utf-8"><title>SatQuery AI Lite report</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 20px;color:#111}h1{font-size:22px}h2{font-size:16px;border-bottom:1px solid #ddd;padding-bottom:4px;margin-top:28px}li{margin:3px 0}.q{color:#555}.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}figure{margin:0}img{width:100%;border:1px solid #ccc}figcaption{font-size:12px;color:#555}@media print{section{break-inside:avoid}}</style><h1>SatQuery AI Lite — analysis report</h1><p class="q"><b>Query:</b> ${esc(r.query)}</p><div class="figs">${imgs}</div>${secs}`;
}
function renderReport(r) {
  const root = h('div', 'card', h('h2', null, 'Report')), dl = h('div', 'dl');
  const add = (label, fn) => { const b = h('button', 'btn small', label); b.onclick = fn; dl.append(b); };
  const id = r.analysis_id.slice(0, 12);
  add('Download JSON (full result)', () => download(`satquery-${id}.json`, 'application/json', JSON.stringify(r, null, 2)));
  add('Markdown', () => download(`satquery-${id}.md`, 'text/markdown', r.report.markdown));
  if (r.report.regions_csv) add('Regions CSV', () => download(`satquery-${id}-regions.csv`, 'text/csv', r.report.regions_csv));
  if (r.report.sensitivity_csv) add('Sensitivity CSV', () => download(`satquery-${id}-sensitivity.csv`, 'text/csv', r.report.sensitivity_csv));
  add('Open printable report', () => { const url = URL.createObjectURL(new Blob([printableReport(r)], { type: 'text/html' })); window.open(url, '_blank'); });
  root.append(dl, h('p', 'caption', 'Every file is generated from the same backend result shown on screen; the interface adds no content.'));
  for (const s of r.report.sections) root.append(h('div', 'report-sec', h('h3', null, s.title), s.paragraphs.map(p => h('p', null, p)), s.bullets.length ? h('ul', 'list', s.bullets.map(b => h('li', null, b))) : null));
  return root;
}
function renderTrace(r) {
  const d = h('details', 'trace', h('summary', null, `Execution trace · ${r.trace.length} steps`));
  d.append(h('div', 'trace-lines', r.trace.map(t => h('div', null, h('span', 't', t.time), h('span', 'l', t.label), h('span', null, t.detail), h('span', 'ms', r.timings_ms && r.timings_ms[t.label] != null ? r.timings_ms[t.label] + ' ms' : '')))));
  return d;
}

/* ───────────── STAC inspector ───────────── */
function renderStac(w) {
  const card = h('div', 'card', h('h2', null, 'STAC item inspector'),
    h('p', 'muted', 'Paste one STAC Item JSON object, or an array of two. Only the metadata you paste is inspected: nothing is fetched and no asset is opened or analysed.'));
  const ta = h('textarea'); ta.style.minHeight = '180px'; ta.placeholder = '{ "type": "Feature", "id": "…", "properties": { "datetime": "…" }, "assets": { … } }';
  const sel = h('select'); sel.append(new Option('purpose (two items): change — same modality, two dates', 'change'), new Option('purpose (two items): fusion — optical + SAR', 'fusion')); sel.style.marginTop = '8px';
  const out = h('div'); out.style.marginTop = '14px';
  const go = h('button', 'btn primary', 'Inspect'); go.style.marginTop = '8px';
  go.onclick = async () => {
    let parsed; try { parsed = JSON.parse(ta.value); } catch (e) { out.replaceChildren(h('div', 'banner err', 'That is not valid JSON.')); return; }
    const items = Array.isArray(parsed) ? parsed : [parsed];
    const body = { items }; if (items.length === 2) body.purpose = sel.value;
    const r = await api('/api/stac/inspect', body);
    out.replaceChildren(r.ok ? stacResult(r) : h('div', 'banner err', h('h3', null, 'Not inspected'), r.error ? r.error.message : 'Request failed'));
  };
  card.append(ta, sel, go, out); w.append(card);
}
function stacResult(r) {
  const root = h('div');
  for (const it of r.items) {
    const c = h('div', 'card', h('h2', null, it.id), h('div', 'chiprow', h('span', 'badge', 'modality: ' + it.modality.value), it.cloud_cover_pct != null ? h('span', 'badge', 'cloud ' + pct(it.cloud_cover_pct, 0)) : null),
      h('dl', 'kv', h('dt', null, 'collection'), h('dd', null, it.collection || '—'), h('dt', null, 'platform'), h('dd', null, it.platform || '—'), h('dt', null, 'datetime'), h('dd', null, it.datetime || it.start_datetime || '—'),
        h('dt', null, 'bbox'), h('dd', null, it.bbox ? it.bbox.join(', ') : '—'), h('dt', null, 'EPSG'), h('dd', null, it.epsg || '—'), h('dt', null, 'bands'), h('dd', null, it.bands.map(b => b.name).join(', ') || '—'), h('dt', null, 'modality basis'), h('dd', null, it.modality.basis)));
    c.append(h('table', null, h('thead', null, h('tr', null, h('th', null, 'asset'), h('th', null, 'type'), h('th', null, 'Lite v1'))), h('tbody', null, it.assets.map(a => h('tr', null, h('td', 'mono', a.key), h('td', null, a.type || '—'), h('td', 'muted', a.lite_v1_note))))));
    if (it.findings.length) c.append(h('ul', 'list', it.findings.map(f => h('li', null, `[${f.severity}] ${f.message}`))));
    c.append(h('div', 'caption', it.scope_note)); root.append(c);
  }
  if (r.comparison) root.append(h('div', 'card', h('h2', null, 'Pair compatibility'), h('div', 'chiprow', badge(r.comparison.state), h('span', 'badge', 'gap ' + (r.comparison.gap_days == null ? '—' : fmt(r.comparison.gap_days, 1) + ' d')), h('span', 'badge', 'bbox IoU ' + (r.comparison.bbox_iou == null ? '—' : fmt(r.comparison.bbox_iou, 2)))), r.comparison.findings.length ? h('ul', 'list', r.comparison.findings.map(f => h('li', null, `[${f.severity}] ${f.message}`))) : h('p', 'muted', 'No compatibility concerns found.')));
  return root;
}

/* ───────────── wiring ───────────── */
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('.navtabs button').forEach(b => b.onclick = () => {
  S.view = b.dataset.view; document.querySelectorAll('.navtabs button').forEach(x => x.classList.toggle('active', x === b));
  $('#side').classList.toggle('hidden', S.view === 'stac'); document.querySelector('main').style.gridTemplateColumns = S.view === 'stac' ? '1fr' : ''; renderWork();
});
$('#runBtn').onclick = run; $('#checkBtn').onclick = check;
$('#resetBtn').onclick = () => { $('#query').value = ''; setMode(S.mode); };
boot();
</script>
